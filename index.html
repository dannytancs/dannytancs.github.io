            <svg id="music-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>
        </button>
        <style>
            #music-toggle{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2147483645;width:44px;height:44px;border-radius:50%;border:0;padding:0;align-items:center;justify-content:center;cursor:pointer;color:#455721;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
            #music-toggle:hover{background:#fff}
        </style>
        <script>
            (function () {
                var intro = document.getElementById('intro');
                var audio = document.getElementById('bg-music');
                var btn = document.getElementById('music-toggle');
                var on = document.getElementById('music-on');
                var off = document.getElementById('music-off');

                function render() {
                    var muted = audio.paused;
                    on.style.display = muted ? 'none' : '';
                    off.style.display = muted ? '' : 'none';
                    btn.setAttribute('aria-label', muted ? 'Play music' : 'Mute music');
                }
                audio.addEventListener('play', render);
                audio.addEventListener('pause', render);

                // Clicking the envelope: remove the overlay and start the music (loops forever)
                intro.addEventListener('click', function () {
                    audio.play().catch(function () {});
                    btn.style.display = 'flex';
                    intro.style.opacity = '0';
                    intro.style.pointerEvents = 'none';
                    setTimeout(function () { intro.remove(); }, 900);
                    render();
                });

                btn.addEventListener('click', function () {
                    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
                });
            })();
        </script>
    </body>
</html>
